[project]
name = "orchestrator-plugin"
version = "1.0.0"
description = "Auto-generated orchestrator plugin"
requires-python = ">=3.9"

dependencies = [
    "pydantic>=2.0",
    "typing_extensions>=4.0",
    "Jinja2>=3.1.0",
    "google-genai",
    "anthropic",
    "openai",
    "tenacity",
    "pyyaml",
    "langfuse>=2.50.0",
    "python-dotenv"
]

[tool.poetry]
packages = [
    { include = "src" }
]

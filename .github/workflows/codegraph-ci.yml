name: CI CodeGraph Build Check
on: [push, pull_request]
jobs:
  build-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build CodeGraph
        run: npx -y @colbymchenry/codegraph init --index

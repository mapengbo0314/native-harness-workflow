[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-wf"
version = "0.1.0"
description = "Agentic Harness Lifecycle Initialization CLI"
authors = [
    {name = "mapengbo0314"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "openai",
    "anthropic",
    "instructor",
    "pydantic",
    "jsonref",
    "tenacity",
    "pyyaml",
    "Jinja2>=3.1.0",
    "langfuse>=2.50.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
harness-wf = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

[tool.setuptools.package-data]
"harness" = ["templates/boilerplate/**/*", "templates/boilerplate/**/.*"]

[tool.pytest.ini_options]
filterwarnings = [
    "error::SyntaxWarning",
]

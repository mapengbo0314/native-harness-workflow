[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-wf"
version = "0.1.2"
description = "Agentic Harness Lifecycle Initialization CLI"
authors = [
    {name = "mapengbo0314"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "openai",
    "anthropic",
    "instructor",
    "pydantic",
    "jsonref",
    "tenacity",
    "pyyaml",
    "Jinja2>=3.1.0",
    "langfuse>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.27.2",
]

[project.scripts]
harness-wf = "harness.init.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

[tool.setuptools.package-data]
"harness" = ["templates/boilerplate/**/*", "templates/boilerplate/**/.*", "adapters/*.json"]

[tool.pytest.ini_options]
norecursedirs = ["tests/fixtures", "benchmark/fixtures", "scripts"]
filterwarnings = [
    "error::SyntaxWarning",
]
